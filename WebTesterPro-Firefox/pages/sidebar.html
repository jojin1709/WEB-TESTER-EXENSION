<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebTester Pro Sidebar</title>
<link rel="stylesheet" href="../css/main.css">
<style>
body { width: 320px; min-height: 100vh; padding: 0; }
.sb-header {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 10px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 10;
}
.sb-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 700;
  background: linear-gradient(135deg, #9c27ff, #ce93d8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.sb-body { padding: 10px 12px; }
.sb-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
.sb-tab { padding: 7px 12px; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--text2); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.12s; }
.sb-tab:hover { color: var(--text); }
.sb-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.sb-panel { display: none; }
.sb-panel.active { display: block; }
.sb-payload { display: flex; align-items: center; gap: 8px; padding: 7px 9px; background: var(--card2); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 5px; cursor: pointer; }
.sb-payload:hover { border-color: var(--accent2); }
.sb-p-name { font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.sb-p-cat { font-size: 10px; color: var(--accent3); flex-shrink: 0; }
.sb-copy { background: none; border: none; color: var(--text3); cursor: pointer; padding: 3px; border-radius: 4px; flex-shrink: 0; }
.sb-copy:hover { color: var(--accent); }
.sb-note { padding: 8px; background: var(--card2); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 5px; cursor: pointer; }
.sb-note:hover { border-color: var(--accent2); }
.sb-note-title { font-size: 12px; font-weight: 600; }
.sb-note-preview { font-size: 11px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-open-ws {
  width: 100%; margin-top: 10px; padding: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff; border: none; border-radius: var(--radius);
  font-size: 12px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.sb-open-ws:hover { opacity: 0.85; }
.sb-quick-cats { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.sb-cat { padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--card2); color: var(--text2); transition: all 0.1s; }
.sb-cat:hover { border-color: var(--accent); color: var(--accent); }
.sb-cat.active { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body>
<div class="sb-header">
  <div class="sb-logo">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9c27ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    WebTester Pro
  </div>
  <!-- No onclick attribute — event listener attached in sidebar.js -->
  <button id="sbOpenWorkspace" class="sb-open-ws" style="width:auto;padding:5px 10px;font-size:11px;margin:0">
    Open →
  </button>
</div>

<div class="sb-body">
  <div class="search-wrap" style="margin-bottom:10px">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" id="sbSearch" placeholder="Search payloads…" style="font-size:12px" autocomplete="off">
  </div>

  <div class="sb-tabs">
    <span class="sb-tab active" data-sbtab="payloads">Payloads</span>
    <span class="sb-tab" data-sbtab="favorites">Favorites</span>
    <span class="sb-tab" data-sbtab="notes">Notes</span>
  </div>

  <div id="sb-payloads" class="sb-panel active">
    <div class="sb-quick-cats" id="sbCats">
      <span class="sb-cat active" data-cat="all">All</span>
      <span class="sb-cat" data-cat="xss">XSS</span>
      <span class="sb-cat" data-cat="sqli">SQLi</span>
      <span class="sb-cat" data-cat="ssrf">SSRF</span>
      <span class="sb-cat" data-cat="lfi">LFI</span>
      <span class="sb-cat" data-cat="ssti">SSTI</span>
    </div>
    <div id="sbPayloadList"></div>
  </div>

  <div id="sb-favorites" class="sb-panel">
    <div id="sbFavList"></div>
  </div>

  <div id="sb-notes" class="sb-panel">
    <div id="sbNoteList"></div>
  </div>

  <button id="sbOpenWorkspace2" class="sb-open-ws" style="margin-top:12px">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18M9 21V9"/>
    </svg>
    Open Full Workspace
  </button>
</div>

<div id="toast-container" class="toast-container"></div>

<!-- All JS in external files — no inline scripts (AMO requirement) -->
<script src="../js/compat.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/payloads.js"></script>
<script src="../js/sidebar.js"></script>
</body>
</html>
