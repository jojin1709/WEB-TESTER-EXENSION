<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebTester Pro</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/popup.css">
</head>
<body>
<div class="popup-header">
  <div class="popup-logo">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9c27ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    WebTester Pro
  </div>
  <div class="popup-actions">
    <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
    <button class="icon-btn" id="openSettings" title="Settings" aria-label="Settings">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
</div>

<div class="popup-body">
  <div class="search-row">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Search payloads…" autocomplete="off">
    </div>
  </div>

  <div class="quick-cats" id="quickCats">
    <span class="quick-cat active" data-cat="all">All</span>
    <span class="quick-cat" data-cat="xss">XSS</span>
    <span class="quick-cat" data-cat="sqli">SQLi</span>
    <span class="quick-cat" data-cat="ssrf">SSRF</span>
    <span class="quick-cat" data-cat="lfi">LFI</span>
    <span class="quick-cat" data-cat="xxe">XXE</span>
    <span class="quick-cat" data-cat="ssti">SSTI</span>
  </div>

  <!-- Favorites -->
  <div id="favSection">
    <div class="section-label">⭐ Favorites</div>
    <div id="favList"></div>
  </div>

  <div class="divider" id="innerDivider"></div>

  <!-- Recent -->
  <div id="recentSection">
    <div class="section-label">🕒 Recently Used</div>
    <div id="recentList"></div>
  </div>

  <!-- Search results (replaces above when searching) -->
  <div class="divider" id="searchDivider" style="display:none"></div>
  <div id="searchResults"></div>

  <button class="open-workspace-btn" id="openWorkspace">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><path d="M3 9h18M9 21V9"/></svg>
    Open Full Workspace
  </button>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="js/compat.js"></script>
<script src="js/utils.js"></script>
<script src="js/payloads.js"></script>
<script src="js/popup.js"></script>
</body>
</html>
